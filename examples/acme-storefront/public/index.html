<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order details</title>
    <style>
      body {
        background: #f5f7fb;
        color: #172033;
        font-family: system-ui, sans-serif;
        margin: 0;
      }

      main {
        margin: 4rem auto;
        max-width: 36rem;
        padding: 0 1rem;
      }

      .order-card {
        background: white;
        border: 1px solid #d8deea;
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1.5rem rgb(23 32 51 / 8%);
        padding: 1.5rem;
      }

      .order-card dl {
        display: grid;
        grid-template-columns: 8rem 1fr;
        margin-bottom: 0;
      }

      .order-card dt,
      .order-card dd {
        margin: 0;
        padding: 0.5rem 0;
      }

      .order-items {
        margin-top: 1.5rem;
      }

      .shipment {
        border-top: 1px solid #d8deea;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
      }

      .shipment h3,
      .shipment h4 {
        margin: 0 0 0.75rem;
      }

      .shipment h4 {
        margin-top: 1.5rem;
      }

      .shipment-summary {
        overflow-wrap: anywhere;
      }

      .tracking-timeline {
        list-style: none;
        margin: 0 0 0 0.35rem;
        padding: 0 0 0 1.25rem;
      }

      .tracking-event {
        border-left: 2px solid #8ca3c7;
        padding: 0 0 1.5rem 1.25rem;
        position: relative;
      }

      .tracking-event:last-child {
        padding-bottom: 0;
      }

      .tracking-event::before {
        background: #245ca6;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #245ca6;
        content: "";
        height: 0.65rem;
        left: -0.43rem;
        position: absolute;
        top: 0.25rem;
        width: 0.65rem;
      }

      .tracking-event p {
        margin: 0;
      }

      .tracking-event-status {
        font-weight: 700;
      }

      .tracking-event .tracking-event-description {
        margin-top: 0.25rem;
      }

      .tracking-event .tracking-event-meta {
        color: #526078;
        display: flex;
        flex-wrap: wrap;
        font-size: 0.9rem;
        gap: 0.25rem 1rem;
        margin-top: 0.4rem;
      }

      .order-items h3 {
        margin: 0 0 0.75rem;
      }

      .order-items-table-container {
        overflow-x: auto;
      }

      .order-items table {
        border-collapse: collapse;
        min-width: 32rem;
        width: 100%;
      }

      .order-items th,
      .order-items td {
        border-bottom: 1px solid #d8deea;
        padding: 0.75rem;
        text-align: left;
      }

      .order-items th {
        white-space: nowrap;
      }

      .order-items th:nth-child(n + 3),
      .order-items td:nth-child(n + 3) {
        text-align: right;
      }

      @media (max-width: 28rem) {
        main {
          margin: 2rem auto;
        }

        .order-card {
          padding: 1rem;
        }

        .order-card dl {
          grid-template-columns: 1fr;
        }

        .order-card dd {
          padding-top: 0;
        }

        .tracking-event-meta {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Order details</h1>
      <div id="app">Loading order...</div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
